# 单一事实源：BACKEND-PATH §7（打包、签名、CI 双平台产出）
#
# 签名/公证均走环境变量注入（CI Secrets，不落库）：
#   macOS：APPLE_CERT_BASE64 / APPLE_CERT_PASSWORD / APPLE_TEAM_ID / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD
#          齐全则 electron-builder 自动 codesign + xcrun notarytool 公证 + staple
#   Windows：CSC_LINK（p12 base64，CI 中以 WIN_CSC_LINK 注入后改名）/ CSC_KEY_PASSWORD（对应 WIN_CSC_KEY_PASSWORD）
#          齐全则 electron-builder 内建 Authenticode 签名
# 缺证书时本地 `npm run dist` 仍能产出「未签名」包，仅 Gatekeeper/SmartScreen 会拦截最终用户。
#
# 前置依赖：resources/icon.icns（mac）与 resources/icon.ico（win）必须存在，否则打包中断。
appId: com.gztelecom.newmedia.workbench
productName: AI新媒体工作台
icon: resources/icon
publish:
  # 仅用于生成 electron-updater 所需的 latest*.yml；运行时真实 R2 地址由
  # resources/update-source.json 覆盖，不会把上传密钥或私有仓库凭据打进应用。
  provider: generic
  url: https://updates.example.invalid/ai-newmedia-workbench
directories:
  output: dist
  buildResources: resources
afterPack: scripts/adhoc-sign-mac.cjs
files:
  - out/**/*
  - package.json
# 运行时资源采用白名单。resources 同时包含大量仅供构建使用的图标源文件、
# iconset 与设计素材；这些不应被重复复制到安装后的 App Resources。
# bootstrap 是首次安装本机抓取/下载运行环境所必需；update-source.json 由 CI
# 在已配置更新源时动态生成，必须允许进入最终包。
extraResources:
  - from: resources
    to: resources
    filter:
      - "bootstrap/**"
      - "licenses/**"
      - "THIRD_PARTY_NOTICES.md"
      - "update-source.json"
mac:
  target:
    - dmg
    - zip
  category: public.app-category.business
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}.${ext}
dmg:
  title: ${productName} ${version}
  window:
    width: 660
    height: 440
  iconSize: 92
  contents:
    - x: 150
      y: 180
      type: file
    - x: 500
      y: 180
      type: link
      path: /Applications
    - x: 325
      y: 350
      type: file
      path: resources/首次安装并修复.command
    - x: 510
      y: 350
      type: file
      path: resources/首次安装说明.txt
win:
  target:
    - nsis
    - msi
  artifactName: ${productName}-${version}-setup.${ext}
  publisherName: jiangjiawei
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
