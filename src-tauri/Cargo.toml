[package]
name = "newmedia-workbench-rs"
version = "2.0.1"
description = "AI新媒体工作台（Tauri 2 + Rust 原生重构版）"
authors = ["jiangjiawei"]
edition = "2021"

[lib]
name = "newmedia_workbench_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "net", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "gzip", "deflate"] }
dirs = "6"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
regex = "1"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
aes-gcm = "0.10"
scrypt = "0.11"
rand = "0.8"
rust_xlsxwriter = "0.79"
zip = { version = "2", default-features = false, features = ["deflate"] }
once_cell = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
