# M5 双平台打包 / 签名 / CI（单一事实源 BACKEND-PATH §7）
#
# - macOS 包（.dmg / .zip）在 macos-latest 构建并自动 codesign + notarize
# - Windows 包（.exe / .msi）在 windows-latest 构建并自动 Authenticode 签名
# - 两 job 并行；打 tag（v*）时自动合入 GitHub Draft Release
# - 证书 Secrets 两 runner 隔离：Mac 持有 APPLE_*，Win 持有 WIN_CSC_*

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS (.dmg / .zip)
    runs-on: macos-latest
    env:
      UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
      ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
      APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # HeroUI 当前依赖树同时兼容项目现有的 Tailwind 3；按 lockfile
        # 以兼容模式安装，避免 CI 擅自升级到 Tailwind 4。
        run: npm install --legacy-peer-deps
        env:
          # 壳二进制由 electron-builder 在构建期自行下载，安装期跳过以加速
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Verify icons present
        run: |
          test -f resources/icon.icns || { echo "::error::缺少 resources/icon.icns（macOS 图标），请先放入；详见 resources/README.md"; exit 1; }
          echo "macOS icon OK"

      - name: Configure update source
        if: ${{ env.UPDATE_SERVER_URL != '' && env.ALIYUN_OSS_BUCKET != '' && env.ALIYUN_OSS_REGION != '' }}
        run: |
          oss_region="${ALIYUN_OSS_REGION#oss-}"
          oss_url="https://${ALIYUN_OSS_BUCKET}.oss-${oss_region}.aliyuncs.com"
          printf '{\n  "provider": "generic",\n  "url": "%s",\n  "fallbackUrl": "%s",\n  "timeoutMs": 6000\n}\n' "$UPDATE_SERVER_URL" "$oss_url" > resources/update-source.json

      - name: Import Apple codesign certificate
        if: ${{ env.APPLE_CERT_BASE64 != '' }}
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          echo "$APPLE_CERT_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain
          rm -f cert.p12

      - name: Build & sign macOS
        run: npm run dist:mac
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac
          retention-days: 1
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  build-win:
    name: Build Windows (.exe / .msi)
    runs-on: windows-latest
    env:
      UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
      ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # 与 macOS 构建保持同一份锁定依赖树。
        run: npm install --legacy-peer-deps
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Verify icons present
        run: |
          if (-not (Test-Path resources/icon.ico)) {
            Write-Error "缺少 resources/icon.ico（Windows 图标），请先放入；详见 resources/README.md"
            exit 1
          }
          Write-Host "Windows icon OK"

      - name: Configure update source
        if: ${{ env.UPDATE_SERVER_URL != '' && env.ALIYUN_OSS_BUCKET != '' && env.ALIYUN_OSS_REGION != '' }}
        shell: bash
        env:
          UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
        run: |
          oss_region="${ALIYUN_OSS_REGION#oss-}"
          oss_url="https://${ALIYUN_OSS_BUCKET}.oss-${oss_region}.aliyuncs.com"
          printf '{\n  "provider": "generic",\n  "url": "%s",\n  "fallbackUrl": "%s",\n  "timeoutMs": 6000\n}\n' "$UPDATE_SERVER_URL" "$oss_url" > resources/update-source.json

      - name: Build & sign Windows
        run: npm run dist:win
        env:
          # §7 约定 Windows 证书 Secrets 名为 WIN_CSC_*，映射为 electron-builder 标准变量
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win
          retention-days: 1
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  publish-updates:
    name: Publish incremental updates to R2 and OSS
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    # 标签发布和手动从 main 发布都允许同步更新节点；手动发布用于修复发布配置后
    # 不改写已经存在的版本标签。
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check R2 configuration
        id: config
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_BUCKET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "R2 secrets are not configured; skip incremental update upload."
          fi

      - name: Check OSS configuration
        id: oss_config
        env:
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: |
          if [ -n "$ALIYUN_OSS_BUCKET" ] && [ -n "$ALIYUN_OSS_REGION" ] && [ -n "$ALIYUN_OSS_ACCESS_KEY_ID" ] && [ -n "$ALIYUN_OSS_ACCESS_KEY_SECRET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Aliyun OSS secrets are not configured; skip domestic update upload."
          fi

      - name: Upload updater files
        if: steps.config.outputs.enabled == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          oss_region="${ALIYUN_OSS_REGION#oss-}"
          oss_endpoint="https://oss-${oss_region}.aliyuncs.com"
          mkdir -p updater-files
          # electron-builder 的更新描述文件使用安全 ASCII 文件名；构建产物可保留中文
          # 展示名称，因此这里按 latest*.yml 中的 path 建立给更新器读取的副本。
          mac_path="$(awk '/^path:/{print $2; exit}' artifacts/mac/latest-mac.yml)"
          win_path="$(awk '/^path:/{print $2; exit}' artifacts/win/latest.yml)"
          mac_zip="$(find artifacts/mac -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          win_exe="$(find artifacts/win -maxdepth 1 -type f -name '*.exe' | head -n 1)"
          test -n "$mac_path" && test -f "$mac_zip"
          test -n "$win_path" && test -f "$win_exe"
          cp "$mac_zip" "updater-files/$mac_path"
          cp "$mac_zip.blockmap" "updater-files/$mac_path.blockmap"
          cp "$win_exe" "updater-files/$win_path"
          cp "$win_exe.blockmap" "updater-files/$win_path.blockmap"
          cp artifacts/mac/latest-mac.yml updater-files/latest-mac.yml
          cp artifacts/win/latest.yml updater-files/latest.yml
          # 先上传安装包和差分信息，最后上传 latest*.yml，避免客户端读到未完成的版本。
          for file in updater-files/*; do
            [ "${file##*.}" = 'yml' ] && continue
            aws s3 cp "$file" "s3://$R2_BUCKET/$(basename "$file")" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --no-progress
          done
          for file in updater-files/*.yml; do
            [ -e "$file" ] || continue
            aws s3 cp "$file" "s3://$R2_BUCKET/$(basename "$file")" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --no-progress
          done
          aws s3 ls "s3://$R2_BUCKET/" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"

      - name: Upload updater files to OSS
        if: steps.oss_config.outputs.enabled == 'true'
        env:
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          oss_region="${ALIYUN_OSS_REGION#oss-}"
          oss_endpoint="https://oss-${oss_region}.aliyuncs.com"
          # OSS only accepts virtual-hosted-style requests.  Without this,
          # AWS CLI sends path-style requests and OSS returns
          # SecondLevelDomainForbidden.
          aws_config_file="$RUNNER_TEMP/aws-oss-config"
          cat > "$aws_config_file" <<'EOF'
          [default]
          request_checksum_calculation = when_required
          response_checksum_validation = when_required
          s3 =
              addressing_style = virtual
          EOF
          export AWS_CONFIG_FILE="$aws_config_file"
          export AWS_DEFAULT_REGION="$oss_region"
          mkdir -p updater-files
          mac_path="$(awk '/^path:/{print $2; exit}' artifacts/mac/latest-mac.yml)"
          win_path="$(awk '/^path:/{print $2; exit}' artifacts/win/latest.yml)"
          mac_zip="$(find artifacts/mac -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          win_exe="$(find artifacts/win -maxdepth 1 -type f -name '*.exe' | head -n 1)"
          test -n "$mac_path" && test -f "$mac_zip"
          test -n "$win_path" && test -f "$win_exe"
          cp "$mac_zip" "updater-files/$mac_path"
          cp "$mac_zip.blockmap" "updater-files/$mac_path.blockmap"
          cp "$win_exe" "updater-files/$win_path"
          cp "$win_exe.blockmap" "updater-files/$win_path.blockmap"
          cp artifacts/mac/latest-mac.yml updater-files/latest-mac.yml
          cp artifacts/win/latest.yml updater-files/latest.yml
          for file in updater-files/*; do
            [ "${file##*.}" = 'yml' ] && continue
            aws s3 cp "$file" "s3://$ALIYUN_OSS_BUCKET/$(basename "$file")" --endpoint-url "$oss_endpoint" --no-progress
          done
          for file in updater-files/*.yml; do
            aws s3 cp "$file" "s3://$ALIYUN_OSS_BUCKET/$(basename "$file")" --endpoint-url "$oss_endpoint" --no-progress
          done

  release:
    name: Draft GitHub Release
    needs: [build-mac, build-win, publish-updates]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
