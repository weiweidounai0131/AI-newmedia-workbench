# macOS 单端增量更新：用于快速修复与验证，不构建 Windows 安装包，且只更新 latest-mac.yml。
name: Release macOS Update

on:
  push:
    tags:
      - 'mac-v*'
  workflow_dispatch:

jobs:
  build-and-publish-mac:
    name: Build and publish macOS update
    runs-on: macos-latest
    env:
      UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
      ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
      # 内部开发者版不使用 Apple Developer ID；由 afterPack 生成可验证的临时签名。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Configure update source
        run: |
          test -n "$UPDATE_SERVER_URL" && test -n "$ALIYUN_OSS_BUCKET" && test -n "$ALIYUN_OSS_REGION"
          oss_region="${ALIYUN_OSS_REGION#oss-}"
          oss_url="https://${ALIYUN_OSS_BUCKET}.oss-${oss_region}.aliyuncs.com"
          printf '{\n  "provider": "generic",\n  "url": "%s",\n  "fallbackUrl": "%s",\n  "timeoutMs": 6000\n}\n' "$UPDATE_SERVER_URL" "$oss_url" > resources/update-source.json

      - name: Build macOS package
        run: npm run dist:mac

      - name: Publish macOS updater files
        run: |
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_BUCKET" && test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$ALIYUN_OSS_BUCKET" && test -n "$ALIYUN_OSS_REGION" && test -n "$ALIYUN_OSS_ACCESS_KEY_ID" && test -n "$ALIYUN_OSS_ACCESS_KEY_SECRET"
          mac_path="$(awk '/^path:/{print $2; exit}' dist/latest-mac.yml)"
          mac_zip="$(find dist -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          mac_dmg="$(find dist -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          test -n "$mac_path" && test -f "$mac_zip" && test -f "$mac_dmg"
          mkdir -p updater-files
          cp "$mac_zip" "updater-files/$mac_path"
          cp "$mac_zip.blockmap" "updater-files/$mac_path.blockmap"
          cp "$mac_dmg" "updater-files/$(basename "$mac_dmg")"
          cp "$mac_dmg.blockmap" "updater-files/$(basename "$mac_dmg").blockmap"
          cp dist/latest-mac.yml updater-files/latest-mac.yml
          for file in updater-files/*; do
            [ "${file##*.}" = 'yml' ] && continue
            aws s3 cp "$file" "s3://$R2_BUCKET/$(basename "$file")" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --no-progress
          done
          aws s3 cp updater-files/latest-mac.yml "s3://$R2_BUCKET/latest-mac.yml" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --no-progress
          export AWS_ACCESS_KEY_ID="$ALIYUN_OSS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$ALIYUN_OSS_ACCESS_KEY_SECRET"
          oss_region="${ALIYUN_OSS_REGION#oss-}"
          oss_endpoint="https://oss-${oss_region}.aliyuncs.com"
          # OSS only accepts virtual-hosted-style requests.  Without this,
          # AWS CLI sends path-style requests and OSS returns
          # SecondLevelDomainForbidden.
          aws_config_file="$RUNNER_TEMP/aws-oss-config"
          cat > "$aws_config_file" <<'EOF'
          [default]
          s3 =
              addressing_style = virtual
          EOF
          export AWS_CONFIG_FILE="$aws_config_file"
          export AWS_DEFAULT_REGION="$oss_region"
          for file in updater-files/*; do
            [ "${file##*.}" = 'yml' ] && continue
            aws s3 cp "$file" "s3://$ALIYUN_OSS_BUCKET/$(basename "$file")" --endpoint-url "$oss_endpoint" --no-progress
          done
          aws s3 cp updater-files/latest-mac.yml "s3://$ALIYUN_OSS_BUCKET/latest-mac.yml" --endpoint-url "$oss_endpoint" --no-progress
