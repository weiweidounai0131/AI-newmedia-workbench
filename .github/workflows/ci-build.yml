name: Build & Release (macOS & Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: Windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript typecheck & frontend build
        run: npm run build

      - name: Rust unit tests & target check
        working-directory: src-tauri
        run: |
          cargo test
          cargo check --target ${{ matrix.target }}

      - name: Build & sign Tauri bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Inject macOS install guide into DMG
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/inject-dmg-readme.sh
          for dmg in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            [ -f "$dmg" ] && scripts/inject-dmg-readme.sh "$dmg"
          done

      - name: Report bundle sizes (macOS)
        if: runner.os == 'macOS'
        run: |
          du -sh src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app || true
          ls -lh src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz* || true
          ls -lh src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg || true

      - name: Report bundle sizes (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*" | Select-Object Name, @{Name="SizeMB";Expression={[math]::Round($_.Length / 1MB, 2)}}

      - name: Upload macOS artifacts (DMG + Updater tar.gz & sig)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 30

      - name: Upload Windows artifacts (NSIS setup.exe & sig)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare normalized ASCII assets & multi-mirror latest.json manifests
        env:
          UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const ver = pkg.version;
          const pubDate = new Date().toISOString();

          const walk = (dir) => {
            if (!fs.existsSync(dir)) return [];
            const out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...walk(p));
              else out.push(p);
            }
            return out;
          };

          const allFiles = walk('artifacts');
          const findOne = (suffix) => allFiles.find((f) => f.endsWith(suffix));

          const macDmg = findOne('.dmg');
          const macTar = findOne('.app.tar.gz');
          const macSigFile = findOne('.app.tar.gz.sig');
          const winExe = findOne('-setup.exe');
          const winSigFile = findOne('-setup.exe.sig');

          if (!macDmg || !macTar || !macSigFile || !winExe || !winSigFile) {
            console.error('Missing build artifacts:', { macDmg, macTar, macSigFile, winExe, winSigFile, allFiles });
            process.exit(1);
          }

          fs.mkdirSync('dist-upload', { recursive: true });
          fs.mkdirSync('manifests', { recursive: true });

          const macDmgName = `AI-newmedia-workbench_${ver}_aarch64.dmg`;
          const macTarName = `AI-newmedia-workbench_${ver}_aarch64.app.tar.gz`;
          const winExeName = `AI-newmedia-workbench_${ver}_x64-setup.exe`;

          fs.copyFileSync(macDmg, path.join('dist-upload', macDmgName));
          fs.copyFileSync(macTar, path.join('dist-upload', macTarName));
          fs.copyFileSync(winExe, path.join('dist-upload', winExeName));

          const macSig = fs.readFileSync(macSigFile, 'utf8').trim();
          const winSig = fs.readFileSync(winSigFile, 'utf8').trim();

          const notes = `AI新媒体工作台 v${ver}：Rust + Tauri 2 原生重构版，支持国内优先三源自动更新（阿里云 OSS → Cloudflare R2 → GitHub Releases）。`;

          const makeManifest = (baseUrl) => {
            const cleanBase = baseUrl.replace(/\/+$/, '');
            return JSON.stringify({
              version: ver,
              notes,
              pub_date: pubDate,
              platforms: {
                'darwin-aarch64': {
                  signature: macSig,
                  url: `${cleanBase}/${macTarName}`,
                },
                'windows-x86_64': {
                  signature: winSig,
                  url: `${cleanBase}/${winExeName}`,
                },
              },
            }, null, 2);
          };

          const ossBucket = process.env.ALIYUN_OSS_BUCKET || '';
          const ossRegion = (process.env.ALIYUN_OSS_REGION || '').replace(/^oss-/, '');
          const r2Url = (process.env.UPDATE_SERVER_URL || '').replace(/\/+$/, '');
          const repo = process.env.GITHUB_REPOSITORY;

          if (ossBucket && ossRegion) {
            const ossBase = `https://${ossBucket}.oss-${ossRegion}.aliyuncs.com/v2`;
            fs.writeFileSync('manifests/oss-latest.json', makeManifest(ossBase));
          }
          if (r2Url) {
            fs.writeFileSync('manifests/r2-latest.json', makeManifest(`${r2Url}/v2`));
          }
          const ghBase = `https://github.com/${repo}/releases/download/v${ver}`;
          fs.writeFileSync('manifests/github-latest.json', makeManifest(ghBase));
          fs.copyFileSync('manifests/github-latest.json', path.join('dist-upload', 'latest.json'));

          console.log('Prepared dist-upload:', fs.readdirSync('dist-upload'));
          NODE

      - name: Upload v2 updater assets & latest.json to Aliyun OSS
        env:
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          if [ -z "$ALIYUN_OSS_BUCKET" ] || [ -z "$ALIYUN_OSS_REGION" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "Aliyun OSS secrets not configured, skipping."
            exit 0
          fi
          oss_region="${ALIYUN_OSS_REGION#oss-}"
          oss_endpoint="https://oss-${oss_region}.aliyuncs.com"
          aws_config_file="$RUNNER_TEMP/aws-oss-config"
          cat > "$aws_config_file" <<'EOF'
          [default]
          request_checksum_calculation = when_required
          response_checksum_validation = when_required
          s3 =
              addressing_style = virtual
          EOF
          export AWS_CONFIG_FILE="$aws_config_file"
          export AWS_DEFAULT_REGION="$oss_region"

          # 先上传二进制更新包与完整安装包，最后上传 v2/latest.json（带超时与重试，防跨国链路僵死）
          upload_oss() {
            local src="$1" dst="$2" extra="${3:-}"
            for attempt in 1 2 3; do
              if aws s3 cp "$src" "$dst" --endpoint-url "$oss_endpoint" --cli-connect-timeout 15 --cli-read-timeout 60 --no-progress $extra; then
                return 0
              fi
              echo "OSS upload attempt $attempt failed for $dst, retrying..."
              sleep 5
            done
            return 1
          }
          for f in dist-upload/*.tar.gz dist-upload/*.dmg dist-upload/*.exe; do
            [ -f "$f" ] || continue
            upload_oss "$f" "s3://$ALIYUN_OSS_BUCKET/v2/$(basename "$f")"
          done
          upload_oss manifests/oss-latest.json "s3://$ALIYUN_OSS_BUCKET/v2/latest.json" "--content-type application/json --cache-control no-cache,max-age=60"

      - name: Upload v2 updater assets & latest.json to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "Cloudflare R2 secrets not configured, skipping."
            exit 0
          fi
          r2_endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          for f in dist-upload/*.tar.gz dist-upload/*.dmg dist-upload/*.exe; do
            [ -f "$f" ] || continue
            aws s3 cp "$f" "s3://$R2_BUCKET/v2/$(basename "$f")" --endpoint-url "$r2_endpoint" --no-progress
          done
          aws s3 cp manifests/r2-latest.json "s3://$R2_BUCKET/v2/latest.json" \
            --endpoint-url "$r2_endpoint" \
            --content-type "application/json" \
            --cache-control "no-cache, max-age=60" \
            --no-progress

      - name: Publish GitHub Release with signed updater assets & latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-upload/*.dmg
            dist-upload/*.tar.gz
            dist-upload/*.exe
            dist-upload/latest.json
          generate_release_notes: true
